bindd = SUPER SHIFT ALT CTRL, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT CTRL, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10

