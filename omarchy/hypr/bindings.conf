 # Application bindings
bindd = SUPER SHIFT ALT, E, Emacs, exec, ~/.config/hypr/scripts/emacs-open-or-focus.sh
bindd = SUPER SHIFT ALT, C, Org Capture, exec, ~/.config/hypr/scripts/emacs-launcher '(my/org-capture-grouped-wl)'
bindd = SUPER SHIFT ALT, R, Consult Omni Local, exec, emacsclient -n -e '(my/omni-local)'
bindd = SUPER SHIFT ALT, W, Elfeed, exec, ~/.config/hypr/scripts/emacs-launcher '(elfeed)'
bindd = SUPER SHIFT ALT, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT ALT, F, Dirvish, exec, ~/.config/hypr/scripts/emacs-launcher    '(dirvish)'
bindd = SUPER SHIFT ALT CTRL, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT ALT, B, Browser, exec, omarchy-launch-browser
#bindd = SUPER SHIFT ALT CTRL, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT ALT CTRL, B, Browser (private), exec, ~/.config/hypr/scripts/browser-private.sh
bindd = SUPER SHIFT ALT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, N, Editor, exec, omarchy-launch-editor
#bindd = SUPER SHIFT ALT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT ALT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT ALT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT ALT, O, Org Browser, exec, ~/.config/hypr/scripts/emacs-launcher '(my-org-browser-show)'
#bindd = SUPER SHIFT ALT, W, Typora, exec, uwsm-app -- typora
bindd = SUPER SHIFT ALT, SLASH, Passwords, exec, uwsm-app -- 1password
bind = SUPER SHIFT ALT, V, exec, ~/.config/hypr/scripts/record-toggle
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT ALT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT CTRL, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
#bindd = SUPER SHIFT ALT, C, Org Capture, exec, emacs-launcher '(my/org-capture-grouped)'
#bindd = SUPER SHIFT ALT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT ALT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT ALT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT ALT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT ALT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT CTRL, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"
bindd = SUPER SHIFT ALT, S, Search Engine, exec, ~/.local/bin/web-search

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Close windows
bindd = SUPER SHIFT ALT, Q, Close window, killactive,
bindd = CTRL ALT, DELETE, Close all windows, exec, omarchy-hyprland-window-close-all

# Control tiling
#bindd = SUPER, J, Toggle window split, togglesplit, # dwindle
bindd = SUPER, P, Pseudo window, pseudo, # dwindle
bindd = SUPER, T, Toggle window floating/tiling, togglefloating,
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER CTRL, F, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER ALT, F, Full width, fullscreen, 1
bindd = SUPER, O, Pop window out (float & pin), exec, omarchy-hyprland-window-pop

# Move focus with SUPER + arrow keys
bindd = SUPER, LEFT, Move window focus left, movefocus, l
bindd = SUPER, RIGHT, Move window focus right, movefocus, r
bindd = SUPER, UP, Move window focus up, movefocus, u
bindd = SUPER, DOWN, Move window focus down, movefocus, d

# Switch workspaces with SUPER + [1-9; 0]
unbind = SUPER SHIFT ALT, code:10
bindd = SUPER SHIFT ALT, code:10, Switch to workspace 1, workspace, 1
unbind = SUPER SHIFT ALT, code:11
bindd = SUPER SHIFT ALT, code:11, Switch to workspace 2, workspace, 2
unbind = SUPER SHIFT ALT, code:12
bindd = SUPER SHIFT ALT, code:12, Switch to workspace 3, workspace, 3
unbind = SUPER SHIFT ALT, code:13
bindd = SUPER SHIFT ALT, code:13, Switch to workspace 4, workspace, 4
unbind = SUPER SHIFT ALT, code:14
bindd = SUPER SHIFT ALT, code:14, Switch to workspace 5, workspace, 5
unbind = SUPER SHIFT ALT, code:15
bindd = SUPER SHIFT ALT, code:15, Switch to workspace 6, workspace, 6
unbind = SUPER SHIFT ALT, code:16
bindd = SUPER SHIFT ALT, code:16, Switch to workspace 7, workspace, 7
unbind = SUPER SHIFT ALT, code:17
bindd = SUPER SHIFT ALT, code:17, Switch to workspace 8, workspace, 8
unbind = SUPER SHIFT ALT, code:18
bindd = SUPER SHIFT ALT, code:18, Switch to workspace 9, workspace, 9
unbind = SUPER SHIFT ALT, code:19
bindd = SUPER SHIFT ALT, code:19, Switch to workspace 10, workspace, 10

