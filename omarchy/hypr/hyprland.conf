# Learn how to configure Hyprland: https://wiki.hypr.land/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu
# workspace_padding=0,0,0,35   # left, top, right, bottom
#windowrulev2 = float, "Emacs", ".*mini-frame.*"
# Floating minibuffer for mini-frame
#windowrule = float, "Emacs", ".*mini-frame.*"
# Float Emacs mini-frame only
#windowrule = float, class="Emacs", title_regex=".*mini-frame.*"
#windowrule = tile, class="Emacs"
# Example for floating Emacs mini-frame (persistent minibuffer)
#windowrule = float, class="Emacs", title_regex=".*mini-frame.*", workspace=, monitor=
# Floating Emacs minibuffer frame
#windowrule = match:class="Emacs", title_regex=".*mini-frame.*", float, no_fullscreen
#windowrule = match:class,Emacs,title_regex,.*mini-frame.*,float,no_fullscreen
#windowrule = float, .*mini-frame.*
windowrule {
    name = "Float minibuffer"
    match:class = "Emacs"
    match:title = ".*mini-frame.*"
    float = on
}


# -----------------------------
# Zathura PDF viewer rules
# -----------------------------

# Float Zathura windows
windowrule = float on, match:class ^Zathura$

# Set floating size (adjust to your screen if needed)
windowrule = size 1200 900, match:class ^Zathura$:wq

# Center the window on screen
windowrule = center on, match:class ^Zathura$
windowrule = float on, match:title ^omni-local$, center on
windowrule = float on, match:title ^omni-web$, center on
windowrule = float on, match:title ^omni-multi$, center on
windowrule = float on, match:title ^omni-deep$, center on
windowrule = float on, match:title ^(omni)$, center on

# Godot — disable Omarchy transparency/frosted glass
windowrule = opacity 1.0 override 1.0 override, match:class ^Godot$
windowrule = no_blur on, match:class ^Godot$
# Normal Brave Origin Beta -> workspace 1
# Private windows are excluded by title.
## Normal Zen windows -> workspace 1
# Normal Zen windows -> workspace 1
windowrule = workspace 1, match:class ^zen$, match:title ^Zen Browser$
